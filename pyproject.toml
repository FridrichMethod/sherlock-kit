[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlock-kit"
version = "0.1.0"
description = "Shared Sherlock policy, bounded transport and typed CPU operations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/FridrichMethod/sherlock-kit"
Documentation = "https://github.com/FridrichMethod/sherlock-kit/blob/main/README.md"
Issues = "https://github.com/FridrichMethod/sherlock-kit/issues"

[project.scripts]
shk = "sherlock_kit:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["sherlock_kit", "sherlock_partitions", "sherlock_orchestration", "sherlock_artifacts", "sherlock_commands", "sherlock_guard"]
packages = ["sherlock_kit_data"]

[tool.setuptools.package-data]
sherlock_kit_data = ["partitions.json", "SHERLOCK.md", "build_identity.json", "adapters/**"]
