[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlock-kit"
version = "0.1.0"
description = "Shared Sherlock policy and bounded OpenSSH foundation"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
shk = "sherlock_kit:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["sherlock_kit"]
packages = ["sherlock_kit_data"]

[tool.setuptools.package-data]
sherlock_kit_data = ["SHERLOCK.md", "build_identity.json"]
