[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlock-kit"
version = "0.4.0"
description = "Small standard-library interface for agents to run Slurm jobs and move data on Stanford Sherlock"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/FridrichMethod/sherlock-kit"
Documentation = "https://github.com/FridrichMethod/sherlock-kit/blob/main/README.md"
Issues = "https://github.com/FridrichMethod/sherlock-kit/issues"

[project.scripts]
shk = "sherlock_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
sherlock_kit = ["data/*.json", "data/remote/*.sh", "data/rules/*.md", "data/skills/*/SKILL.md"]
