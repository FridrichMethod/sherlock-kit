repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5 # keep the dev extra's ruff pin in pyproject.toml equal to this
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # The rules files and the skill are delivered verbatim (the partition block must stay
  # byte-identical to partitions.markdown()), so mdformat leaves package data alone.
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--number]
        exclude: ^src/sherlock_kit/data/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        files: ^(src/|bin/shk$)

  # The remote programs are POSIX sh, run by dash or bash-as-sh on Sherlock.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--shell=sh]
        files: ^src/sherlock_kit/data/remote/.*\.sh$

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: [-w, -i, "4", -ln, posix]
        files: ^src/sherlock_kit/data/remote/.*\.sh$
